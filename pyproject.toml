[project]
name = "vecworld"
version = "0.1.0"
description = "Dream Roam: roam a painted 360° dream world in third person"
readme = "README.md"
authors = [
    { name = "Veera", email = "veerakarthick609@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "fastapi>=0.146.0",
    "gguf>=0.19.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "selenium>=4.51.0",
]

[tool.pytest.ini_options]
markers = ["gpu: needs real models/GPU", "ui: drives headless Firefox"]
addopts = "-m 'not gpu and not ui'"
testpaths = ["tests"]
pythonpath = ["tests"]
