<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Roam transition</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #eef1f6; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  #hud { position: fixed; left: 12px; top: 10px; background: rgba(10,12,18,.62); padding: 6px 10px; border-radius: 8px; font: 12px ui-monospace, monospace; pointer-events: none; }
</style>
<script>
  // Collected for the tests: any uncaught error or rejection on this page.
  window.roamErrors = [];
  addEventListener("error", e => roamErrors.push(String(e.message || e.error)));
  addEventListener("unhandledrejection", e => roamErrors.push(String(e.reason && e.reason.stack || e.reason)));
</script>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/"}}</script>
</head><body>
<div id="hud">loading…</div>
<script type="module">
// Dev page: a chain of spots from the fixtures (meta {heading, scale, distance}, parent-relative), walked across
// automatically. Each spot's child is built and placed when the player enters it, as the game will.
// Query: ?auto=0 manual WASD · ?chain=N spots (past 3 the fixtures repeat 1, 2, 1, 2…) · ?distance=d / ?scale=s
// override every child's meta · ?haze=x dissolves through haze · ?clear=rrggbb clear colour (tests look for it).
import * as THREE from "three";
import { World, bearingVec } from "./world.js";
import { Hero, Keys, OrbitCam } from "./hero.js";

const q = new URLSearchParams(location.search);
const AUTO = q.get("auto") !== "0", CHAIN = Number(q.get("chain") || 3), FIX = q.get("fixtures") || "fixtures";
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#" + (q.get("clear") || "c9cfc4"));
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 300);
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
scene.add(new THREE.HemisphereLight(0xfff3dd, 0x3a4a2a, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-3, 8, 4); scene.add(sun);

const img = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("load " + src)); i.src = src; });
const world = new World(scene);
world.onError = err => roamErrors.push(String(err.message || err));
world.hazeAmt = Number(q.get("haze") || 0);
const [hero, files] = await Promise.all([
  Hero.load(scene),
  Promise.all([0, 1, 2].map(async i => {
    const [pano, depth, meta] = await Promise.all([img(`${FIX}/spot_${i}.jpg`), img(`${FIX}/depth_${i}.png`),
      fetch(`${FIX}/meta_${i}.json`).then(r => r.json())]);
    return { pano, depth, meta };
  })),
]);
const fileOf = i => i < 3 ? i : 1 + ((i - 1) % 2);
function metaOf(i) {
  const m = { ...files[fileOf(i)].meta };
  if (i > 0 && q.has("distance")) m.distance = Number(q.get("distance"));
  if (i > 0 && q.has("scale")) m.scale = Number(q.get("scale"));
  return m;
}
const build = i => world.buildSpot(files[fileOf(i)].pano, files[fileOf(i)].depth, { ...metaOf(i), index: i });
const childOf = e => world.spots.find(s => s.parent === e && s.index === e.index + 1);
const placing = new Set();
async function placeNext(e) {                 // build the spot after e and place it from e (if e is still around)
  const i = e.index + 1;
  if (i >= CHAIN || placing.has(e) || childOf(e)) return;
  placing.add(e);
  try {
    const s = await build(i), m = metaOf(i);
    if (world.spots.includes(e)) world.placeChild(e, m.heading, m.distance, m.scale, s); else world.remove(s);
  } finally { placing.delete(e); }
}

const first = await build(0);
world.addSpot(first, { x: 0, z: 0 }, first.meta.heading, 1);
await placeNext(first);

const keys = new Keys(), cam = new OrbitCam(renderer.domElement);
cam.yaw = OrbitCam.yawFor(first.meta.heading);
const p = hero.pos;
let manual = false, paused = false, frames = 0, frameMs = 0, last = performance.now(), autoDone = !AUTO, maxBuilt = 0;
const switches = [];
addEventListener("keydown", () => { manual = true; });

// Auto-walk: toward the next spot's origin once it is placed; before that, out along its exit heading (holding at
// the edge until it arrives); past the last spot, on along its heading to near its edge.
function autoInput() {
  const cur = world.current, i = cur.index, next = childOf(cur);
  let tx, tz;
  if (next) { tx = next.origin.x; tz = next.origin.z; }
  else {
    const last = i + 1 >= CHAIN, v = bearingVec(last ? cur.heading : metaOf(i + 1).heading), f = last ? 0.8 : 1.5;
    const lim = world.limitAt(cur, last ? cur.heading : metaOf(i + 1).heading);
    tx = v.x * f * lim; tz = v.z * f * lim;
    if (last && Math.hypot(tx - p.x, tz - p.y) < 0.1) autoDone = true;
  }
  if (autoDone) return { fwd: 0, side: 0, run: false };
  const want = -Math.atan2(tx - p.x, -(tz - p.y));            // the camera yaw looking toward the target
  let d = want - cam.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); cam.yaw += d * 0.15;
  return { fwd: 1, side: 0, run: false };
}

const hud = document.getElementById("hud");
function pose() {
  hero.place(world.k);
  cam.apply(camera, new THREE.Vector3(world.k * p.x, 0, world.k * p.y));
  scene.updateMatrixWorld(); camera.updateMatrixWorld();
}
function screenOf(obj) {                      // pixel position of an object's origin with the camera as posed
  const v = obj.getWorldPosition(new THREE.Vector3()).project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
}
function draw() { pose(); world.render(renderer, scene, camera); }

renderer.setAnimationLoop(t => {
  const dt = paused ? 0 : Math.min(0.05, (t - last) / 1000); last = t;
  const t0 = performance.now();
  if (!paused) {
    hero.update(dt, autoDone || manual ? keys.input : autoInput(), cam.yaw, world.k);
    world.constrain(p);
    const from = world.current;
    const at = p.length();
    pose(); const before = screenOf(from.group);           // a fixed point of the scenery, before the switch…
    const to = world.update(p, hero.dir.lengthSq() ? hero.dir : null);
    if (to) {
      pose(); const after = screenOf(from.group);          // …and after it, with the camera re-posed
      switches.push({ from: from.index, to: to.index, at, dx: after.x - before.x, dy: after.y - before.y, k: world.k });
      placeNext(to).catch(e => roamErrors.push(String(e.stack || e)));
    }
    world.tick(dt);
  }
  draw();
  maxBuilt = Math.max(maxBuilt, world.spots.length);
  frames++; frameMs += performance.now() - t0;
  if (dev.pauseWhen && dev.pauseWhen(roam)) { paused = true; dev.pauseWhen = null; }
  hud.textContent = `spot ${world.current.index} · pos ${p.x.toFixed(2)}, ${p.y.toFixed(2)} · heading ${hero.heading.toFixed(0)}°` +
    (world.fade ? ` · fade ${world.fading.toFixed(2)}` : "") + (world.edge ? " · edge" : "") +
    ` · ${(frameMs / frames).toFixed(1)} ms/frame (CPU)`;
});

// Read-only debug state.
const roam = Object.freeze(Object.defineProperties({}, {
  ready: { get: () => true, enumerable: true },
  spotIndex: { get: () => world.current.index, enumerable: true },
  pos: { get: () => ({ x: p.x, z: p.y }), enumerable: true },
  heading: { get: () => hero.heading, enumerable: true },
  world: { get: () => ({ x: world.abs.x + world.abs.s * p.x, z: world.abs.z + world.abs.s * p.y }), enumerable: true },
  walked: { get: () => hero.walked, enumerable: true },
  fading: { get: () => !!world.fade, enumerable: true },
  fade: { get: () => world.fade ? world.fading : null, enumerable: true },
  edge: { get: () => world.edge && { ...world.edge }, enumerable: true },
  built: { get: () => world.spots.length, enumerable: true },
  maxBuilt: { get: () => maxBuilt, enumerable: true },
  workerBuilt: { get: () => world.workerBuilt, enumerable: true },
  triangles: { get: () => world.spots.reduce((a, s) => a + s.triangles, 0), enumerable: true },
  memory: { get: () => ({ ...renderer.info.memory }), enumerable: true },
  switches: { get: () => switches.map(s => ({ ...s })), enumerable: true },
  k: { get: () => world.k, enumerable: true },
  frameMs: { get: () => frames ? frameMs / frames : null, enumerable: true },
}));
window.roam = roam;

// Dev hooks for the tests and the screenshot driver (not part of the game).
const gl = renderer.getContext();
const dev = window.roamDev = {
  world, hero,
  pauseWhen: null,
  get paused() { return paused; }, set paused(v) { paused = v; last = performance.now(); },
  resetFrameTime() { frames = 0; frameMs = 0; },
  // Jump to chain spot i on its own (built afresh at the origin), stop the auto-walk, and place its child.
  async goto(i) {
    autoDone = true;
    const s = await build(i);
    world.addSpot(s, { x: 0, z: 0 }, s.meta.heading, 1);
    world.jumpTo(s, p); cam.yaw = OrbitCam.yawFor(s.heading);
    await placeNext(s);
  },
  look(yawDeg, pitch) { if (yawDeg != null) cam.yaw = OrbitCam.yawFor(yawDeg); if (pitch != null) cam.setPitch(pitch); },
  show(i) { world.override = i == null ? null : world.spots.find(s => s.index === i) ?? null; },  // render only spot i
  // Render one frame now (optionally looking along yawDeg at pitch) and count the clear-colour pixels in it.
  voidPixels(yawDeg, pitch) {
    if (yawDeg != null) this.look(yawDeg, pitch);
    draw();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const want = scene.background.clone().convertLinearToSRGB();
    const r = Math.round(want.r * 255), g = Math.round(want.g * 255), b = Math.round(want.b * 255);
    let n = 0;
    for (let i = 0; i < px.length; i += 4)
      if (Math.abs(px[i] - r) <= 2 && Math.abs(px[i + 1] - g) <= 2 && Math.abs(px[i + 2] - b) <= 2) n++;
    return n;
  },
};
</script>
</body></html>
