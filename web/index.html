<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Walk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="the dream; drag to look around">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="spinner" hidden></div>
  </main>

  <div id="intro">
    <h1>Dream Walk</h1>
    <p>Type a place to dream of and pick a mood.<br>Then look around, walk on, and step toward what you find.</p>
  </div>

  <div id="keys" hidden>drag or <kbd>A</kbd> <kbd>D</kbd> to look · <kbd>W</kbd> walk · <kbd>S</kbd> turn back · click a discovery to approach</div>

  <div id="dock">
    <!-- Must match vecworld.config.MOODS (checked by tests/test_ui.py). -->
    <div id="moods" role="group" aria-label="moods">
      <button type="button" class="chip" data-mood="foggy" aria-pressed="false">foggy</button>
      <button type="button" class="chip" data-mood="night" aria-pressed="false">night</button>
      <button type="button" class="chip" data-mood="rain" aria-pressed="false">rain</button>
      <button type="button" class="chip" data-mood="snow" aria-pressed="false">snow</button>
      <button type="button" class="chip" data-mood="eerie" aria-pressed="false">eerie</button>
      <button type="button" class="chip" data-mood="warm" aria-pressed="false">warm</button>
    </div>
    <form id="theme">
      <input id="theme-text" autocomplete="off" maxlength="120" placeholder="dream of a place…" aria-label="theme" autofocus>
    </form>
  </div>

  <div id="pad" hidden>
    <button type="button" id="go-walk" aria-label="walk on">↑</button>
    <button type="button" id="go-back" aria-label="turn back">↓</button>
  </div>

  <div id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
