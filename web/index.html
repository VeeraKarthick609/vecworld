<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vecworld</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop"></div>

  <main id="stage">
    <img id="scene-a" class="scene" alt="">
    <img id="scene-b" class="scene" alt="">
    <div id="hotspots"></div>
    <div id="spinner" hidden></div>
  </main>

  <div id="intro">
    <h1>vecworld</h1>
    <p>Walk through the inside of a language model.<br>Type a word to land where the model keeps it, then click what you see, or walk with W A S D.</p>
  </div>

  <canvas id="mindmap" width="400" height="320" hidden></canvas>

  <div id="keys" hidden><kbd>W</kbd> walk on · <kbd>A</kbd> <kbd>D</kbd> left / right · <kbd>S</kbd> back · or click</div>

  <form id="jump">
    <input id="jump-text" autocomplete="off" maxlength="200" placeholder="type a word to enter the model's mind…" autofocus>
  </form>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
